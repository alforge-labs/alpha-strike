version: 2
updates:
  # Python パッケージ（uv が pyproject.toml + uv.lock を使うが、Dependabot は pip エコシステムとして扱う）
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      fastapi:
        patterns:
          - "fastapi"
          - "starlette"
          - "uvicorn*"
      pydantic:
        patterns:
          - "pydantic*"
      moomoo-sdk:
        patterns:
          - "futu-api"
          - "moomoo-api"
      test:
        patterns:
          - "pytest*"
      lint:
        patterns:
          - "ruff"

  # GitHub Actions ワークフロー
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
