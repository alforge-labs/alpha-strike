version: 2
updates:
  # Python パッケージ（uv ネイティブ対応。pyproject.toml + uv.lock を直接解釈し、
  # ロックの確定バージョンを bump する PR を出す。"pip" エコシステムでは uv.lock を
  # 解釈せず、`futu-api>=...` の下限充足済み指定では PR が出ないため "uv" を使う）
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
    # 公開直後の不安定版で uv がロックできない PR を避けるため数日寝かせる
    cooldown:
      default-days: 7
    groups:
      fastapi:
        patterns:
          - "fastapi"
          - "starlette"
          - "uvicorn*"
      pydantic:
        patterns:
          - "pydantic*"
      # futu-api は VM の OpenD バイナリとバージョン結合する。CI(FakeProvider)では
      # OpenD 互換を検証できないため、この PR は auto-merge せず必ず手動レビューし、
      # docs/ops/futu-opend-upgrade.md の昇格 Runbook(OpenD ロックステップ)に従うこと。
      futu-sdk:
        patterns:
          - "futu-api"
      test:
        patterns:
          - "pytest*"
      lint:
        patterns:
          - "ruff"

  # GitHub Actions ワークフロー
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
