[project]
name = "alpha-strike"
version = "1.0.1"
description = "Self-hosted webhook bridge from TradingView alerts to moomoo / OANDA brokers, with Cloudflare Tunnel + WAF reference architecture."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["tradingview", "webhook", "moomoo", "oanda", "fastapi", "paper-trading", "algotrading"]
authors = [
    { name = "alforge-labs", email = "yoshiaki@sakae.org" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.135.2",
    "futu-api>=10.5.6508",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "slowapi>=0.1.9",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.42.0",
]

[project.urls]
Homepage = "https://alforgelabs.com/"
Documentation = "https://alforgelabs.com/ja/docs/guides/alpha-strike-setup/"
Repository = "https://github.com/alforge-labs/alpha-strike"
Issues = "https://github.com/alforge-labs/alpha-strike/issues"
Changelog = "https://github.com/alforge-labs/alpha-strike/blob/main/CHANGELOG.md"
"X (Twitter)" = "https://x.com/Alforge_bot"

[project.scripts]
alpha-strike = "alpha_strike.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_strike"]

[tool.ruff.lint]
# ruff 0.16.0 はデフォルト有効ルールを 59 → 413 に拡張する破壊的変更を行った。
# これまで alpha-strike は select 未設定（＝従来デフォルト）で clean だったため、
# 0.16 に上げると新規 413 ルールで 84 件の違反が顕在化する。うち 30 件は
# DTZ（datetime の tz 付与）で、発注システムの時刻ロジックを機械的に tz-aware 化
# すると挙動が変わりうる。移行ガイドの推奨に従い、従来デフォルト相当の select を
# 明示 pin して挙動を固定する（バージョンは最新化しつつ lint 挙動は不変）。
# 413 ルールの段階導入（時刻ロジックのレビューを伴う）は別作業とする。
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "bump-my-version>=0.32.0",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.7",
]

[tool.bumpversion]
current_version = "1.0.1"
commit = true
message = "chore: バージョン {new_version} にバンプ"
tag = true
tag_name = "v{new_version}"
tag_message = "v{new_version}"
allow_dirty = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
