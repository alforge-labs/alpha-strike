[project]
name = "alpha-strike"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "backtrader>=1.9.78.123",
    "fastapi>=0.135.2",
    "futu-api>=10.5.6508",
    "matplotlib>=3.10.8",
    "moomoo-api>=10.5.6508",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "slowapi>=0.1.9",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.42.0",
]

[dependency-groups]
dev = [
    "bump-my-version>=0.32.0",
    "httpx>=0.28.1",
    "pyinstaller>=6.20.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.7",
]

[tool.bumpversion]
current_version = "0.1.0"
commit = true
message = "chore: バージョン {new_version} にバンプ"
tag = true
tag_name = "v{new_version}"
tag_message = "v{new_version}"
allow_dirty = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
