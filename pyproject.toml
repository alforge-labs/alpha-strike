[project]
name = "alpha-strike"
version = "0.2.0"
description = "Self-hosted webhook bridge from TradingView alerts to moomoo / OANDA brokers, with Cloudflare Tunnel + WAF reference architecture."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["tradingview", "webhook", "moomoo", "oanda", "fastapi", "paper-trading", "algotrading"]
authors = [
    { name = "alforge-labs", email = "yoshiaki@sakae.org" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "backtrader>=1.9.78.123",
    "fastapi>=0.135.2",
    "futu-api>=10.5.6508",
    "matplotlib>=3.10.8",
    "moomoo-api>=10.5.6508",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "slowapi>=0.1.9",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.42.0",
]

[project.urls]
Homepage = "https://alforgelabs.com/"
Documentation = "https://alforgelabs.com/ja/docs/guides/alpha-strike-setup/"
Repository = "https://github.com/alforge-labs/alpha-strike"
Issues = "https://github.com/alforge-labs/alpha-strike/issues"
Changelog = "https://github.com/alforge-labs/alpha-strike/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "bump-my-version>=0.32.0",
    "httpx>=0.28.1",
    "pyinstaller>=6.20.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.7",
]

[tool.bumpversion]
current_version = "0.2.0"
commit = true
message = "chore: バージョン {new_version} にバンプ"
tag = true
tag_name = "v{new_version}"
tag_message = "v{new_version}"
allow_dirty = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
